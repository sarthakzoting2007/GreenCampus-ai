<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreenCampus App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-bg-glow"></div>
    
    <main class="mobile-container">
        <!-- Header -->
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=1d1d1f&color=fff&size=88" alt="User">
                </div>
                <div class="user-greeting">
                    <span class="greeting-text">Welcome back,</span>
                    <h1 class="user-name">Campus Admin</h1>
                </div>
            </div>
            <button class="icon-btn notification">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="feather">
                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="badge-dot"></span>
            </button>
        </header>

        <h2 class="section-title">Dashboard</h2>

        <!-- Main Card like a Bank Card -->
        <section class="main-card">
            <div class="card-top">
                <div class="badge-pill">
                    <span class="dot pulse"></span> Live AI
                </div>
                <div class="brand">GreenCampus</div>
            </div>
            
            <p class="card-label">Total energy saved</p>
            <h3 class="card-value"><span id="out-saved">0.00</span><small>W</small></h3>
            
            <div class="card-bottom">
                <div class="info-group">
                    <span class="info-label">Occupancy</span>
                    <span class="info-value" id="out-students">0</span>
                </div>
                <div class="info-group">
                    <span class="info-label">Algorithm</span>
                    <span class="info-value">Active</span>
                </div>
            </div>
        </section>

        <!-- Action Row -->
        <section class="action-row">
            <button class="action-btn" id="toggle-camera-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Camera
            </button>
            <button class="action-btn" id="manual-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                Manual
            </button>
            <button class="action-btn circle-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </section>

        <!-- Bottom Sheet equivalent -->
        <section class="bottom-sheet">
            <div class="drag-handle"></div>
            
            <div class="sheet-header">
                <h2>Classroom Status</h2>
                <a href="#" class="view-all">View all</a>
            </div>

            <!-- List Items -->
            <div class="list-item">
                <div class="item-icon bg-light">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </div>
                <div class="item-content">
                    <h4>Lights Active</h4>
                    <p>Current power draw</p>
                </div>
                <div class="item-value negative" id="out-lights">0</div>
            </div>

            <div class="list-item">
                <div class="item-icon bg-fan">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.93 4.93l14.14 14.14 M14.14 4.93L4.93 19.07"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
                <div class="item-content">
                    <h4>Fans Active</h4>
                    <p>Current cooling</p>
                </div>
                <div class="item-value negative" id="out-fans">0</div>
            </div>
            
            <div class="feed-section" id="camera-section">
                <div class="feed-wrapper">
                    <img src="{{ url_for('video_feed') }}" alt="Camera Feed" id="camera-feed-img">
                </div>
                <p class="feed-status" id="status-text">Waking up AI model...</p>
            </div>
            
            <div class="manual-input-section hidden" id="manual-section">
                <input type="number" id="students" placeholder="How many students?" min="0">
                <button id="calculate-btn">Set</button>
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
